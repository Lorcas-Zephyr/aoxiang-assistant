name: Build re-signable iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-re-signable-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-device-app:
    name: Archive unsigned iPhone/iPad app
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run portable Swift tests
        run: |
          swift test --package-path ios/AoxiangCore
          swift test --package-path ios/AoxiangApp

      - name: Archive an unsigned device bundle and package IPA
        env:
          IOS_RE_SIGNABLE_IPA_OUTPUT: ${{ runner.temp }}/AoxiangAssistant-re-signable.ipa
        run: bash scripts/build_ios_re_signable_ipa.sh

      - name: Verify IPA bundle layout
        env:
          IPA_PATH: ${{ runner.temp }}/AoxiangAssistant-re-signable.ipa
        run: |
          set -euo pipefail
          test -s "$IPA_PATH"
          unzip -Z1 "$IPA_PATH" | grep -Fx 'Payload/AoxiangAssistant.app/Info.plist'
          unzip -Z1 "$IPA_PATH" | grep -Fx 'Payload/AoxiangAssistant.app/PlugIns/AoxiangAssistantWidget.appex/Info.plist'

      - name: Upload re-signable IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AoxiangAssistant-re-signable-${{ github.run_number }}
          path: ${{ runner.temp }}/AoxiangAssistant-re-signable.ipa
          if-no-files-found: error
          retention-days: 7
