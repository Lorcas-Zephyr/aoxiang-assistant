name: Build re-signable iOS IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit containing the iPhone/iPad source to archive
        required: true
        default: iOS
        type: string
      app_bundle_identifier:
        description: Team-owned host App ID to stamp into the unsigned archive
        required: true
        default: cn.nwpu.aoxiangassistant
        type: string
      widget_bundle_identifier:
        description: Team-owned Widget App ID to stamp into the unsigned archive
        required: true
        default: cn.nwpu.aoxiangassistant.widget
        type: string
      app_group_identifier:
        description: Team-owned App Group shared by the host and Widget
        required: true
        default: group.cn.nwpu.aoxiang-assistant
        type: string

permissions:
  contents: read

concurrency:
  group: ios-re-signable-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-device-app:
    name: Archive unsigned iPhone/iPad app
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run portable Swift tests
        run: |
          swift test --package-path ios/AoxiangCore
          swift test --package-path ios/AoxiangApp

      - name: Archive an unsigned device bundle and package IPA
        env:
          IOS_RE_SIGNABLE_IPA_OUTPUT_DIR: ${{ runner.temp }}/ios-artifacts
          IOS_APP_BUNDLE_IDENTIFIER: ${{ inputs.app_bundle_identifier }}
          IOS_WIDGET_BUNDLE_IDENTIFIER: ${{ inputs.widget_bundle_identifier }}
          IOS_APP_GROUP_IDENTIFIER: ${{ inputs.app_group_identifier }}
        run: bash scripts/build_ios_re_signable_ipa.sh

      - name: Verify both IPA bundle layouts
        env:
          IPA_DIR: ${{ runner.temp }}/ios-artifacts
        run: |
          set -euo pipefail
          test -s "$IPA_DIR/AoxiangAssistant-sideload-re-signable.ipa"
          test -s "$IPA_DIR/AoxiangAssistant-full-widget-re-signable.ipa"
          unzip -Z1 "$IPA_DIR/AoxiangAssistant-sideload-re-signable.ipa" | grep -Fx 'Payload/AoxiangAssistant.app/Info.plist'
          ! unzip -Z1 "$IPA_DIR/AoxiangAssistant-sideload-re-signable.ipa" | grep -F 'Payload/AoxiangAssistant.app/PlugIns/'
          unzip -Z1 "$IPA_DIR/AoxiangAssistant-full-widget-re-signable.ipa" | grep -Fx 'Payload/AoxiangAssistant.app/Info.plist'
          unzip -Z1 "$IPA_DIR/AoxiangAssistant-full-widget-re-signable.ipa" | grep -Fx 'Payload/AoxiangAssistant.app/PlugIns/AoxiangAssistantWidget.appex/Info.plist'

      - name: Upload re-signable IPA variants
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AoxiangAssistant-ipa-variants-${{ github.run_number }}
          path: ${{ runner.temp }}/ios-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7
