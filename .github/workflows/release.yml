name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify release asset
        run: |
          test -f "release-assets/aoxiang-assistant-${GITHUB_REF_NAME}.apk"
          test -f "release-notes/${GITHUB_REF_NAME}.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "翱翔助手 ${{ github.ref_name }}"
          body_path: "release-notes/${{ github.ref_name }}.md"
          files: "release-assets/aoxiang-assistant-${{ github.ref_name }}.apk"
