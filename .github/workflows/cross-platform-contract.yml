name: Cross-platform contract

on:
  pull_request:
  push:
    branches:
      - main
      - iOS
    tags:
      - "ios-v*"
  workflow_dispatch:
    inputs:
      require_ios_business_coverage:
        description: Fail unless every iOS business fixture kind is covered
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cross-platform-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-validation:
    name: Validate shared fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate contract fixtures
        run: python scripts/validate_golden_fixtures.py

      - name: Test the fixture validator
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

  android:
    name: Android test, build, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Test and build Android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --console=plain

  ios-readiness:
    name: iOS contract readiness
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate contract fixtures on macOS
        run: python scripts/validate_golden_fixtures.py

      - name: Require the Swift contract package
        run: test -f ios/AoxiangCore/Package.swift

      - name: Run Swift contract tests
        run: swift test --package-path ios/AoxiangCore

      - name: Run iOS app adapter tests
        run: swift test --package-path ios/AoxiangApp

      - name: Build the iPhone and iPad app with the iOS Simulator SDK
        working-directory: ios
        run: >-
          xcodebuild
          -project AoxiangAssistant.xcodeproj
          -scheme AoxiangAssistant
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/aoxiang-assistant-derived-data"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Verify the app and Widget products were built
        working-directory: ios
        run: |
          set -euo pipefail
          product_root="$RUNNER_TEMP/aoxiang-assistant-derived-data/Build/Products/Debug-iphonesimulator"
          test -d "$product_root/AoxiangAssistant.app"
          test -d "$product_root/AoxiangAssistant.app/PlugIns/AoxiangAssistantWidget.appex"

      - name: Enforce complete iOS behavior coverage for release checks
        if: >-
          ${{ startsWith(github.ref, 'refs/tags/ios-v') ||
              inputs.require_ios_business_coverage ||
              vars.AOXIANG_IOS_RELEASE_GATE == '1' }}
        env:
          AOXIANG_REQUIRE_IOS_BUSINESS_COVERAGE: "1"
        run: swift test --package-path ios/AoxiangCore
      - name: Enforce iOS app adapter tests for release checks
        if: >-
          ${{ startsWith(github.ref, 'refs/tags/ios-v') ||
              inputs.require_ios_business_coverage ||
              vars.AOXIANG_IOS_RELEASE_GATE == '1' }}
        env:
          AOXIANG_REQUIRE_IOS_BUSINESS_COVERAGE: "1"
        run: swift test --package-path ios/AoxiangApp
